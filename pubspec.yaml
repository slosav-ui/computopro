name: mi_primera_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  local_auth: ^2.1.8
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2
  shared_preferences: ^2.5.5
  # Importador de Excel (docs/importador_capa2_diseno_datos.md) -- elegir el archivo a subir.
  # El AGP del proyecto ya es 9.0.1 (android/settings.gradle.kts), por encima del piso 8.11.1 que
  # CLAUDE.md marca como condición para evitar el problema histórico de Gradle con este paquete.
  file_picker: ^8.1.2
  # Parseo de Excel del lado del cliente, sin Edge Function -- ver CLAUDE.md, "Importador de
  # Excel/PDF": decisión explícita de no sumar infraestructura de servidor para esta ronda (sin IA,
  # sin límite de Free que aplicar, un solo desarrollador sosteniendo el proyecto).
  excel: ^4.0.6
  # Para LEER un .xlsx no se usa `excel` (ver services/excel_lector_xlsx.dart): un .xlsx es un zip
  # con XML adentro, y estas dos alcanzan. `excel` queda para escribirlos.
  # Ya estaban resueltas como dependencias transitivas de `excel`; se declaran explícitas porque
  # ahora hay código propio que las importa.
  archive: ^3.6.1
  xml: ^6.5.0

  # Libro de obra, tanda 3 (docs/libro_obra_horizonte.md §D decisión 3): adjuntar una foto y una
  # nota de voz a una entrada. Los tres son plugins NATIVOS -- piden permisos en el manifest de
  # Android y en el Info.plist de iOS, a diferencia de todo lo que el proyecto usaba hasta ahora.
  #
  # image_picker y no solo file_picker (que ya estaba): file_picker elige un archivo que YA existe;
  # en obra la foto se saca en el momento, con el casco puesto y la partida adelante.
  image_picker: ^1.1.2
  # Grabar la nota de voz, y reproducirla. Son dos paquetes porque `record` solo graba.
  record: ^7.1.1
  audioplayers: ^6.1.0

  # Notificaciones al telefono -- Tanda 1b (docs/notificaciones_push_diagnostico.md). firebase_core
  # es obligatorio: firebase_messaging no arranca sin la inicializacion del SDK.
  #
  # El envio no se paga (FCM no cobra por mensaje ni por usuario) y el proyecto de Firebase es
  # computopro-31a44. Hoy solo Android: iOS necesita macOS para compilar, que no hay.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Config de flutter_launcher_icons (`dart run flutter_launcher_icons` para
# regenerar). Fuente: assets/icon/ — capa completa, fondo y primer plano
# (66% de zona segura) para el ícono adaptativo de Android, y monocromo
# para el ícono "themed" de Android 13+ (adaptive_icon_monochrome).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/computopro_icon.png"
  adaptive_icon_background: "assets/icon/computopro_icon_background.png"
  adaptive_icon_foreground: "assets/icon/computopro_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/computopro_icon_monochrome.png"
  # Apple rechaza íconos de App Store con canal alpha — computopro_icon.png
  # es RGBA, esto lo aplana automáticamente contra fondo opaco al generar
  # los assets de iOS.
  remove_alpha_ios: true
